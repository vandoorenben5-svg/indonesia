<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#tapp { font-family: var(--font-sans); padding: 1rem 0 0.5rem; }
.thdr { text-align: center; margin-bottom: 1rem; }

.tstat { display: flex; justify-content: center; gap: 1rem; margin-top: 8px; flex-wrap: wrap; }
.tstat span { font-size: 11px; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-secondary); border-radius: 20px; padding: 2px 10px; }
#mwrap { border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; margin-bottom: 1rem; cursor: default; }
#mwrap svg { display: block; width: 100%; height: auto; }
.ocean { fill: #B5D4F4; }
.isl { fill: #C0DD97; stroke: #639922; stroke-width: 0.8; }
@media (prefers-color-scheme: dark) {
  .ocean { fill: #042C53; }
  .isl { fill: #173404; stroke: #3B6D11; }
}
.mloc { cursor: pointer; }
.mdot { transition: fill 0.15s; }
.mlbl { font-size: 8px; font-weight: 500; text-anchor: middle; pointer-events: none; fill: var(--color-text-primary); paint-order: stroke; stroke: var(--color-background-primary); stroke-width: 2.5px; }
@keyframes rpl { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(3.2); opacity: 0; } }
.mpls { fill: none; stroke-width: 1.5; animation: rpl 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
#spanel { display: none; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 0.75rem; }
#spanel.open { display: block; }
.sphead { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 0.75rem; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 0.75rem; }
.spname { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
.spsub { font-size: 12px; color: var(--color-text-secondary); margin-top: 3px; }
.spx { background: none; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--color-text-secondary); }
.spmeta { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 0.75rem; }
.sppill { font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); display: flex; align-items: center; gap: 4px; }
.sppill i { font-size: 13px; }
.spalbl { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
.spacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 6px; margin-bottom: 0; }
.spact { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); font-size: 13px; color: var(--color-text-primary); }
.spact i { font-size: 16px; color: var(--color-text-secondary); flex-shrink: 0; }
.sptip { margin-top: 0.75rem; padding: 8px 12px; background: var(--color-background-info); border-radius: var(--border-radius-md); font-size: 12px; color: var(--color-text-info); }
.snav { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; padding: 0.25rem 0 0.5rem; }
.sndot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-tertiary); cursor: pointer; border: none; padding: 0; transition: all 0.2s; }
.sndot.on { background: var(--color-text-secondary); width: 22px; border-radius: 4px; }
.snlbl { display: flex; justify-content: center; font-size: 11px; color: var(--color-text-secondary); margin-top: 3px; min-height: 15px; }
</style>

      ['ti-moon','Bioluminescent plankton nacht'],
    ]

];

let cur = -1;

function showD(i) {
  cur = i;
  const d = DS[i];
  document.querySelectorAll('.mdot').forEach((el, j) => el.setAttribute('fill', j === i ? '#185FA5' : '#D85A30'));
  document.querySelectorAll('.mpls').forEach((el, j) => el.setAttribute('stroke', j === i ? '#185FA5' : '#D85A30'));
  document.querySelectorAll('.sndot').forEach((el, j) => el.classList.toggle('on', j === i));
  document.getElementById('snlbl').textContent = d.name;

  const p = document.getElementById('spanel');
  p.innerHTML =
    '<div class="sphead">' +
      '<div><div class="spname">' + d.name + '</div><div class="spsub">' + d.sub + '</div></div>' +
      '<button class="spx" onclick="closeD()">✕ sluiten</button>' +
    '</div>' +
    '<div class="spmeta">' +
      '<span class="sppill"><i class="ti ti-calendar" aria-hidden="true"></i>' + d.best + '</span>' +
      '<span class="sppill"><i class="ti ti-clock" aria-hidden="true"></i>' + d.days + '</span>' +
      '<span class="sppill"><i class="ti ti-star" aria-hidden="true"></i>' + d.type + '</span>' +
    '</div>' +
    '<div class="spalbl">Activiteiten &amp; hoogtepunten</div>' +
    '<div class="spacts">' +
      d.acts.map(function(a) { return '<div class="spact"><i class="ti ' + a[0] + '" aria-hidden="true"></i>' + a[1] + '</div>'; }).join('') +
    '</div>' +
    '<div class="sptip"><i class="ti ti-bulb" style="font-size:14px;vertical-align:-2px;margin-right:6px" aria-hidden="true"></i>Tip: ' + d.tip + '</div>';
  p.classList.add('open');
}

function closeD() {
  cur = -1;
  document.getElementById('spanel').classList.remove('open');
  document.querySelectorAll('.mdot').forEach(function(el) { el.setAttribute('fill', '#D85A30'); });
  document.querySelectorAll('.mpls').forEach(function(el) { el.setAttribute('stroke', '#D85A30'); });
  document.querySelectorAll('.sndot').forEach(function(el) { el.classList.remove('on'); });
  document.getElementById('snlbl').textContent = '';
}

var nav = document.getElementById('snav');
DS.forEach(function(d, i) {
  var b = document.createElement('button');
  b.className = 'sndot';
  b.title = d.name;
  b.setAttribute('aria-label', d.name);
  b.addEventListener('click', function() { showD(i); });
  nav.appendChild(b);
});
</script>
